services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: amibook-postgres-build
    environment:
      POSTGRES_DB: amibook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - amibook_pg_data:/var/lib/postgresql/data
     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amibook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  amibook_pg_data: